<!DOCTYPE html>
<html lang="en">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Armata&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<head>
    <meta charset="UTF-8">
    <title>3D Camera</title>
    <style>
        body {
            overflow: hidden;
            text-align: center;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #animationWindow {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="animationWindow">
    </div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.5.3/lottie.min.js'></script>
    <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/35984/ScrubBodymovinTimeline.min.js'></script>
    <script>
        var select = function (s) {
            return document.querySelector(s);
        },
            selectAll = function (s) {
                return document.querySelectorAll(s);
            },
            animationWindow = select('#animationWindow'),
            animData = {
                wrapper: animationWindow,
                animType: 'svg',
                loop: true,
                prerender: true,
                autoplay: true,
                path: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/35984/3D_camera.json'
            }, anim;

        anim = bodymovin.loadAnimation(animData);
        anim.addEventListener('DOMLoaded', onDOMLoaded);
        anim.setSpeed(1.6);

        function onDOMLoaded(e) {
            anim.addEventListener('complete', function () {

            });
        }

    </script>

</body>

</html>
